name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'public/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform 36.1
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36.1" || echo "Platform 36.1 not in the repo, AGP will provision it"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Inject API keys from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
            echo "Wrote GEMINI_API_KEY to .env"
          else
            echo "GEMINI_API_KEY secret not set, building with .env.example defaults"
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "STORE_PASSWORD=$KEYSTORE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using upload keystore from repository secrets"
          else
            PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASSWORD" \
              -keypass "$PASSWORD" \
              -dname "CN=Chroniq, OU=Mobile, O=Chroniq, L=Jakarta, S=DKI Jakarta, C=ID"
            echo "STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 secret is not set. The APK is signed with a throwaway key, so it cannot update an install signed by a different key. Add KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD and KEYSTORE_KEY_PASSWORD secrets for stable builds."
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GRADLE_OPTS: -Djava.awt.headless=true
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Resolve version and stage APK
        id: package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)"
          VERSION="${VERSION:-0.0.0}"
          APK_SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)"
          if [ -z "$APK_SRC" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          APK_NAME="Chroniq-v${VERSION}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK_NAME" | cut -f1)" >> "$GITHUB_OUTPUT"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --print-certs "$APK_NAME" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: chroniq-apk-${{ github.sha }}
          path: ${{ steps.package.outputs.apk }}
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.apk }}
          name: Chroniq ${{ steps.package.outputs.version }}
          generate_release_notes: true

      - name: Build summary
        run: |
          {
            echo "### Chroniq APK built"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.package.outputs.version }}\` |"
            echo "| File | \`${{ steps.package.outputs.apk }}\` |"
            echo "| Size | ${{ steps.package.outputs.size }} |"
            echo "| Signed | release keystore |"
            echo ""
            echo "Download the APK from the workflow artifacts, then enable \"Install unknown apps\" on the phone to install it."
          } >> "$GITHUB_STEP_SUMMARY"
